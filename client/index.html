<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>BookSetu - Buy, Sell, Exchange & Rent Used Books Near You</title>
    <meta
      name="description"
      content="BookSetu is India's local used-book marketplace. Buy, sell, exchange or rent affordable textbooks, novels and study material from sellers in your neighbourhood."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://booksetu.onrender.com/" />
    <meta name="theme-color" content="#059669" />

    <!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BookSetu" />
    <meta property="og:title" content="BookSetu - Buy, Sell, Exchange & Rent Used Books Near You" />
    <meta
      property="og:description"
      content="Find affordable used textbooks and novels near you. Buy, sell, exchange or rent books with local sellers."
    />
    <meta property="og:url" content="https://booksetu.onrender.com/" />
    <meta property="og:image" content="https://booksetu.onrender.com/og-image.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BookSetu - Buy, Sell, Exchange & Rent Used Books Near You" />
    <meta
      name="twitter:description"
      content="Find affordable used textbooks and novels near you. Buy, sell, exchange or rent books with local sellers."
    />
    <meta name="twitter:image" content="https://booksetu.onrender.com/og-image.png" />

    <!-- Structured data: Organization + WebSite (microdata/JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BookSetu",
        "url": "https://booksetu.onrender.com/",
        "description": "India's local used-book marketplace for buying, selling, exchanging and renting books.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://booksetu.onrender.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BookSetu",
        "url": "https://booksetu.onrender.com/",
        "logo": "https://booksetu.onrender.com/logo.png",
        "sameAs": []
      }
    </script>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23059669'/%3E%3Cpath d='M25 30 Q50 20 75 30 L75 74 Q50 64 25 74 Z' fill='white'/%3E%3Cline x1='50' y1='27' x2='50' y2='70' stroke='%23059669' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
